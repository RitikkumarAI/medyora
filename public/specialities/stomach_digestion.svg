<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="60%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </radialGradient>

    <!-- Stomach Body Gradient -->
    <linearGradient id="stomachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="35%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>

    <!-- Esophagus Gradient -->
    <linearGradient id="esophagusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Duodenum / Intestine Gradient -->
    <linearGradient id="duodenumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Digestive Acid Glow -->
    <filter id="stomachGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#EA580C" flood-opacity="0.4"/>
    </filter>
    <filter id="acidGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FBBF24" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)"/>

  <!-- Radiant Amber Pulse Rings -->
  <circle cx="250" cy="250" r="180" fill="#FBBF24" opacity="0.2" filter="blur(30px)"/>
  <circle cx="250" cy="250" r="120" fill="#FFFFFF" opacity="0.7"/>

  <!-- Stomach Anatomical Organ Group -->
  <g filter="url(#stomachGlow)">
    
    <!-- Esophagus (Top Food Pipe Entering Stomach) -->
    <path d="M220 80 L 220 160 C 220 185, 235 195, 245 190 L 255 190 C 255 180, 245 160, 245 80 Z" fill="url(#esophagusGrad)"/>
    <ellipse cx="232" cy="80" rx="12" ry="6" fill="#FED7AA"/>

    <!-- Main Stomach Organ (Fundus, Body & Greater Curvature) -->
    <path d="M220 170 C 170 140, 130 200, 140 260 C 150 330, 200 390, 280 390 C 350 390, 380 330, 360 270 C 345 220, 290 220, 280 250 C 270 280, 240 270, 230 230 C 225 200, 235 180, 220 170 Z" 
          fill="url(#stomachGrad)"/>

    <!-- Duodenum / Small Intestine Outlet (Lower Left Loop) -->
    <path d="M280 390 C 290 405, 320 420, 350 410 C 370 400, 380 370, 360 350 L 350 365 C 360 380, 350 395, 335 400 C 315 405, 295 395, 285 385 Z" 
          fill="url(#duodenumGrad)"/>

    <!-- Highlights & Organ Curvature Sheen -->
    <path d="M155 240 C 145 195, 175 160, 215 175 C 190 190, 165 220, 160 270 C 155 315, 185 360, 240 375 C 190 365, 160 310, 155 240 Z" 
          fill="#FFFFFF" opacity="0.4"/>

    <!-- Glowing Digestive Energy Waves in Center of Stomach -->
    <g filter="url(#acidGlow)" opacity="0.85">
      <ellipse cx="235" cy="290" rx="45" ry="30" fill="#FEF08A" opacity="0.6"/>
      <path d="M200 290 Q 235 270 270 290 Q 235 310 200 290 Z" fill="#FBBF24"/>
      <circle cx="220" cy="285" r="4" fill="#FFFFFF"/>
      <circle cx="245" cy="295" r="5" fill="#FFFFFF"/>
      <circle cx="260" cy="280" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Subtle Gastric Mucosa Lines -->
    <path d="M190 220 C 195 250, 210 280, 205 320" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M270 240 C 285 270, 310 290, 325 320" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Sparkle Elements -->
  <g fill="#F59E0B" opacity="0.8">
    <path d="M110 130 Q 110 142 98 142 Q 110 142 110 154 Q 110 142 122 142 Q 110 142 110 130 Z"/>
    <path d="M390 140 Q 390 150 380 150 Q 390 150 390 160 Q 390 150 400 150 Q 390 150 390 140 Z"/>
  </g>
</svg>
