<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="60%" stop-color="#FFE4E6"/>
      <stop offset="100%" stop-color="#FECDD3"/>
    </radialGradient>

    <!-- Heart Left Ventricle Gradient -->
    <linearGradient id="heartRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="40%" stop-color="#E11D48"/>
      <stop offset="80%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Aorta & Arteries Gradient -->
    <linearGradient id="aortaRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Vena Cava / Veins Blue Gradient -->
    <linearGradient id="veinBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Glowing Pulses -->
    <filter id="heartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#E11D48" flood-opacity="0.45"/>
    </filter>
    <filter id="ecgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)"/>

  <!-- Radiant Pulse Circles -->
  <circle cx="250" cy="240" r="180" fill="#FDA4AF" opacity="0.2" filter="blur(30px)"/>
  <circle cx="250" cy="240" r="120" fill="#FFFFFF" opacity="0.7"/>

  <!-- Anatomical Heart Illustration -->
  <g filter="url(#heartGlow)">
    
    <!-- Superior Vena Cava (Blue top left) -->
    <path d="M190 120 L 190 180 C 190 190, 205 195, 215 185 L 215 120 Z" fill="url(#veinBlue)"/>
    <ellipse cx="202" cy="120" rx="12" ry="6" fill="#7DD3FC"/>

    <!-- Pulmonary Artery (Blue Branch) -->
    <path d="M225 160 C 220 140, 200 135, 175 145 C 165 150, 160 160, 168 170 C 185 165, 205 170, 225 180 Z" fill="url(#veinBlue)"/>

    <!-- Aorta Arch (Red Top Curve) -->
    <path d="M230 180 C 230 110, 290 100, 310 140 C 315 150, 310 170, 295 185 Z" fill="url(#aortaRed)"/>
    <!-- Aorta 3 Branches -->
    <rect x="245" y="90" width="10" height="25" rx="4" fill="#F43F5E"/>
    <rect x="265" y="85" width="10" height="28" rx="4" fill="#F43F5E"/>
    <rect x="285" y="90" width="10" height="25" rx="4" fill="#F43F5E"/>

    <!-- Right Atrium & Ventricle -->
    <path d="M165 210 C 150 250, 170 320, 210 350 C 230 365, 245 375, 255 385 C 250 350, 245 280, 240 210 C 210 200, 180 200, 165 210 Z" 
          fill="url(#veinBlue)"/>

    <!-- Left Ventricle (Apex of Heart, Main Muscle Bulk) -->
    <path d="M240 200 C 245 280, 250 350, 255 385 C 265 375, 330 320, 345 270 C 360 220, 320 180, 280 190 C 260 195, 250 198, 240 200 Z" 
          fill="url(#heartRed)"/>

    <!-- Heart Muscle Highlights & Contour Sheen -->
    <path d="M260 210 C 300 210, 335 240, 325 280 C 315 315, 280 350, 260 370 C 265 330, 265 260, 260 210 Z" 
          fill="#FFFFFF" opacity="0.3"/>

    <!-- Coronary Arteries (Golden/Red Vein Network) -->
    <path d="M250 210 Q 270 260 260 300 Q 280 330 270 360" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M265 270 Q 295 280 310 295" fill="none" stroke="#FDE047" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M255 240 Q 235 260 215 270" fill="none" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Glowing Cyan ECG Heartbeat Waveform Banner Overlay -->
  <g filter="url(#ecgGlow)">
    <path d="M60 260 L 150 260 L 165 235 L 180 285 L 205 170 L 230 330 L 255 240 L 275 275 L 290 260 L 440 260" 
          fill="none" stroke="#0284C7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 260 L 150 260 L 165 235 L 180 285 L 205 170 L 230 330 L 255 240 L 275 275 L 290 260 L 440 260" 
          fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
