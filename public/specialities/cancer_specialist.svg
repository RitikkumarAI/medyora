<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFF1F5"/>
      <stop offset="60%" stop-color="#FFE4ED"/>
      <stop offset="100%" stop-color="#FCD5E2"/>
    </radialGradient>

    <!-- Ribbon Main Gradient -->
    <linearGradient id="ribbonMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7599"/>
      <stop offset="35%" stop-color="#F43F5E"/>
      <stop offset="70%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Ribbon Highlight Gradient -->
    <linearGradient id="ribbonHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF85A2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </linearGradient>

    <!-- Ribbon Shadow Gradient -->
    <linearGradient id="ribbonShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9F1239" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4C0519" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#E11D48" flood-opacity="0.35"/>
    </filter>
    <filter id="innerShade" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#881337" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="250" cy="230" r="170" fill="#FF85A2" opacity="0.15" filter="blur(20px)"/>
  <circle cx="250" cy="230" r="110" fill="#FFFFFF" opacity="0.6"/>

  <!-- Ribbon Group with Drop Shadow -->
  <g filter="url(#softGlow)">
    <!-- Loop Top & Left Arm -->
    <!-- Back Loop Shadow -->
    <path d="M190 280 C 140 210, 150 110, 250 110 C 350 110, 360 210, 310 280 L 370 400 C 355 405, 335 390, 320 375 L 250 255 L 180 375 C 165 390, 145 405, 130 400 Z" 
          fill="url(#ribbonShadow)" opacity="0.3"/>

    <!-- Left Tail (Back Layer) -->
    <path d="M220 230 L 140 375 C 130 395, 155 410, 175 395 L 250 285 Z" 
          fill="url(#ribbonMain)" filter="url(#innerShade)"/>
    <path d="M220 230 L 140 375 C 130 395, 155 410, 175 395 L 250 285 Z" 
          fill="url(#ribbonHighlight)" opacity="0.4"/>

    <!-- Main Top Loop -->
    <path d="M175 250 C 130 190, 150 90, 250 90 C 350 90, 370 190, 325 250 C 295 290, 260 330, 250 345 C 240 330, 205 290, 175 250 Z" 
          fill="url(#ribbonMain)"/>
    
    <!-- Inner Loop Hole (Cutout) -->
    <path d="M205 210 C 185 170, 195 130, 250 130 C 305 130, 315 170, 295 210 C 275 240, 255 270, 250 278 C 245 270, 225 240, 205 210 Z" 
          fill="url(#bgGrad)"/>
    
    <!-- Inner Loop Inner Shadow -->
    <path d="M205 210 C 185 170, 195 130, 250 130 C 305 130, 315 170, 295 210 C 275 240, 255 270, 250 278 C 245 270, 225 240, 205 210 Z" 
          fill="none" stroke="url(#ribbonShadow)" stroke-width="6" opacity="0.35"/>

    <!-- Right Tail (Overlapping Front Layer) -->
    <path d="M280 230 L 360 375 C 370 395, 345 410, 325 395 L 235 250 Z" 
          fill="url(#ribbonMain)" filter="url(#innerShade)"/>

    <!-- Satin Light Sheen Highlights -->
    <path d="M250 90 C 330 90, 355 175, 320 230 C 295 270, 255 315, 235 340 L 230 330 C 250 305, 285 260, 310 220 C 340 170, 320 100, 250 100 Z" 
          fill="#FFFFFF" opacity="0.45"/>

    <path d="M285 240 L 355 370 C 360 380, 350 390, 340 385 L 275 270 Z" 
          fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- Sparkle Stars for Premium Medical Look -->
  <g fill="#FDA4AF" opacity="0.8">
    <path d="M120 120 Q 120 135 105 135 Q 120 135 120 150 Q 120 135 135 135 Q 120 135 120 120 Z"/>
    <path d="M380 110 Q 380 120 370 120 Q 380 120 380 130 Q 380 120 390 120 Q 380 120 380 110 Z"/>
    <path d="M390 280 Q 390 292 378 292 Q 390 292 390 304 Q 390 292 402 292 Q 390 292 390 280 Z"/>
  </g>
</svg>